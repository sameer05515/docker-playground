<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Expense Tracker</a>
        <a class="btn btn-outline-light" th:href="@{/expenses}">Expenses</a>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Dashboard</h1>
            <p class="text-muted">Track your expenses easily.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/expenses/new}">+ Add Expense</a>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h6 class="text-muted">Total Expenses</h6>
                    <h2>₹ <span th:text="${totalExpenses}">0.00</span></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h6 class="text-muted">This Month</h6>
                    <h2>₹ <span th:text="${monthlyExpenses}">0.00</span></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h6 class="text-muted">Number of Expenses</h6>
                    <h2 th:text="${expenseCount}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-5 text-center">
        <a class="btn btn-dark" th:href="@{/expenses}">View All Expenses</a>
    </div>
</div>
</body>
</html>
