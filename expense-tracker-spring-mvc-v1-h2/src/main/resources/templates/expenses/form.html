<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Expense Tracker</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h3 class="mb-0" th:text="${pageTitle}">Add Expense</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/expenses}" th:object="${expense}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input class="form-control" type="text"
                                   th:field="*{title}"
                                   placeholder="e.g. Grocery shopping">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input class="form-control" type="number"
                                   step="0.01" min="0.01"
                                   th:field="*{amount}">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('amount')}"
                                 th:errors="*{amount}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" th:field="*{category}">
                                <option value="">-- Select Category --</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category}"
                                        th:text="${category}"></option>
                            </select>
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('category')}"
                                 th:errors="*{category}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Expense Date</label>
                            <input class="form-control" type="date"
                                   th:field="*{expenseDate}">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('expenseDate')}"
                                 th:errors="*{expenseDate}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="4"
                                      th:field="*{description}"
                                      placeholder="Optional description"></textarea>
                        </div>

                        <button class="btn btn-primary" type="submit">Save</button>
                        <a class="btn btn-secondary" th:href="@{/expenses}">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
