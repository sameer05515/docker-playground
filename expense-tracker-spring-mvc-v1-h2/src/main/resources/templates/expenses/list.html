<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Expense Tracker</a>
        <a class="btn btn-outline-light" th:href="@{/expenses/new}">+ Add Expense</a>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Expenses</h1>
            <p class="text-muted">All recorded expenses</p>
        </div>
        <a class="btn btn-secondary" th:href="@{/}">Dashboard</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(expenses)}">
                        <td colspan="6" class="text-center py-5">No expenses found.</td>
                    </tr>
                    <tr th:each="expense : ${expenses}">
                        <td th:text="${expense.expenseDate}">2026-09-22</td>
                        <td th:text="${expense.title}">Lunch</td>
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${expense.category}">Food</span>
                        </td>
                        <td>₹ <span th:text="${expense.amount}">100.00</span></td>
                        <td th:text="${expense.description}"></td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/expenses/{id}/edit(id=${expense.id})}">
                                Edit
                            </a>
                            <form th:action="@{/expenses/{id}/delete(id=${expense.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Delete this expense?');">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
