{% extends 'base.html' %}
{% block title %}Home - Python Todo MVC{% endblock %}
{% block content %}
<section class="hero">
    <h1>Todo MVC + Keycloak</h1>
    <p>Flask MVC application with OIDC authentication and MySQL persistence.</p>
    {% if session.get('user') %}
        <a class="button" href="{{ url_for('todo.list_todos') }}">Open Todos</a>
    {% else %}
        <a class="button" href="{{ url_for('auth.login') }}">Login with Keycloak</a>
    {% endif %}
</section>
{% endblock %}
