spring.application.name=todo-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/todo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:todo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:todo_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080
