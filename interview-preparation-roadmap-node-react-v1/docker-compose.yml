services:
  mongodb:
    image: mongo:8
    container_name: interview-roadmap-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: interview-roadmap-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/interview_roadmap
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: interview-roadmap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
