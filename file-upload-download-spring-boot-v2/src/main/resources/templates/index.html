<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Manager V2</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#f5f7fb}
.card{background:white;padding:24px;border-radius:12px;box-shadow:0 4px 16px #0001;margin-bottom:20px}
.message{padding:12px;background:#e8f7ee;color:#176b36;border-radius:8px;margin-bottom:15px}
.error{padding:12px;background:#fdecec;color:#9b1c1c;border-radius:8px;margin-bottom:15px}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
a,button{padding:8px 12px;border:0;border-radius:6px;cursor:pointer;text-decoration:none}
.download{background:#2563eb;color:white}.delete{background:#dc2626;color:white}
small{color:#666}
</style>
</head>
<body>
<div class="card">
<h1>File Upload / Download V2</h1>
<div th:if="${message}" class="message" th:text="${message}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>
<form method="post" action="/upload" enctype="multipart/form-data">
<input type="file" name="file" required>
<button type="submit">Upload</button>
</form>
<p><small>Metadata is stored in MongoDB. File bytes are stored in the local ./uploads directory.</small></p>
</div>

<div class="card">
<h2>Uploaded Files</h2>
<p th:if="${#lists.isEmpty(files)}">No files uploaded yet.</p>
<table th:if="${!#lists.isEmpty(files)}">
<thead><tr><th>File Name</th><th>Type</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr></thead>
<tbody>
<tr th:each="file : ${files}">
<td th:text="${file.originalFileName}"></td>
<td th:text="${file.contentType}"></td>
<td th:text="${file.size + ' bytes'}"></td>
<td th:text="${file.uploadedAt}"></td>
<td>
<a class="download" th:href="@{/download/{id}(id=${file.id})}">Download</a>
<form method="post" th:action="@{/delete/{id}(id=${file.id})}" style="display:inline">
<button class="delete" type="submit" onclick="return confirm('Delete this file?')">Delete</button>
</form>
</td>
</tr>
</tbody>
</table>
</div>
</body>
</html>
