services:
  backend:
    build:
      context: ./todo-backend
    container_name: todo-backend
    ports:
      - "8080:8080"
    volumes:
      - todo-data:/app/data

  frontend:
    build:
      context: ./todo-frontend
    container_name: todo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  todo-data:
