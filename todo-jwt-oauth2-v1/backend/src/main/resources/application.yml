server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: todo
    password: todo
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: todo-client
            client-secret: b77SIUXrW9xvWN6sxLT5UgD4ElGbVUWM
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/todo-realm

app:
  jwt:
    secret: "change-this-development-secret-key-to-at-least-32-bytes"
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  frontend-url: http://localhost:5173
