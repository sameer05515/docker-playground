<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Todos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">

    <div class="nav">
        <div>
            <strong>Todo App</strong>
            <span th:text="' | ' + ${user.name}"></span>
            <span th:text="' (' + ${user.role} + ')'"></span>
        </div>

        <div>
            <a th:if="${user.role.name() == 'ROLE_ADMIN'}"
               class="button secondary"
               href="/admin/todos">Admin - All Todos</a>

            <form action="/logout" method="post" style="display:inline">
                <button class="button danger" type="submit">Logout</button>
            </form>
        </div>
    </div>

    <h2 th:text="${user.role.name() == 'ROLE_ADMIN'} ? 'All Todos' : 'My Todos'"></h2>

    <a class="button" href="/todos/new">+ New Todo</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Completed</th>
            <th>Created By</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="todo : ${todos}">
            <td th:text="${todo.id}"></td>
            <td th:text="${todo.title}"></td>
            <td th:text="${todo.description}"></td>
            <td th:text="${todo.completed ? 'Yes' : 'No'}"></td>
            <td th:text="${todo.createdBy.username}"></td>
            <td>
                <a class="button small"
                   th:href="@{/todos/{id}/edit(id=${todo.id})}">
                    Edit
                </a>

                <form th:action="@{/todos/{id}/delete(id=${todo.id})}"
                      method="post"
                      style="display:inline">
                    <button class="button small danger" type="submit">
                        Delete
                    </button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(todos)}">
            <td colspan="6">No todos found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
