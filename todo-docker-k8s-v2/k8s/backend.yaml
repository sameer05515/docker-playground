apiVersion: apps/v1
kind: Deployment
metadata: {name: todo-backend, namespace: todo-app}
spec:
 replicas: 1
 selector: {matchLabels: {app: todo-backend}}
 template:
  metadata: {labels: {app: todo-backend}}
  spec:
   containers:
   - name: backend
     image: todo-backend:0.0.2
     ports: [{containerPort: 8080}]
     env:
     - {name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres:5432/tododb}
     - {name: SPRING_DATASOURCE_USERNAME, value: todo}
     - {name: SPRING_DATASOURCE_PASSWORD, value: todo123}
     readinessProbe:
       httpGet: {path: /actuator/health/readiness, port: 8080}
       initialDelaySeconds: 20
       periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: todo-app}
spec:
 selector: {app: todo-backend}
 ports: [{port: 8080, targetPort: 8080}]
