apiVersion: apps/v1
kind: Deployment
metadata: {name: todo-frontend, namespace: todo-app}
spec:
 replicas: 1
 selector: {matchLabels: {app: todo-frontend}}
 template:
  metadata: {labels: {app: todo-frontend}}
  spec:
   containers:
   - name: frontend
     image: todo-frontend:0.0.2
     ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: todo-app}
spec:
 type: NodePort
 selector: {app: todo-frontend}
 ports: [{port: 80, targetPort: 80, nodePort: 30080}]
